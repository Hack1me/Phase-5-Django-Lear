{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    {% tailwind_css %}
</head>
<body class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-900 via-slate-800 to-blue-900 p-4">

    <!-- Carte principale -->
    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-8">

        <!-- En-tête -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-500 flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A9 9 0 1118.88 17.8M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-white">
                Bon retour 👋
            </h1>

            <p class="text-slate-300 mt-2">
                Connectez-vous à votre compte
            </p>
        </div>

        <!-- Affichage des erreurs Django -->
        {% if messages %}
            <div class="mb-5 p-3 rounded-xl bg-red-500/20 border border-red-400/40 text-red-100 text-sm">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        {% endif %}

        <!-- Formulaire -->
        <form method="POST" class="space-y-5" action="{% url 'sign_in' %}">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label for="id_email" class="block text-sm font-medium text-slate-200 mb-2">
                    Adresse email
                </label>

                <input
                    type="email"
                    name="email"
                    id="id_email"
                    required
                    autofocus
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-400/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
                    placeholder="Votre adresse email">
            </div>

            <!-- Password -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="id_password" class="text-sm font-medium text-slate-200">
                        Mot de passe
                    </label>

                    <a href="{% url 'password_reset ' %}" class="text-sm text-blue-300 hover:text-blue-200 hover:underline">
                        Mot de passe oublié ?
                    </a>
                </div>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-400/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
                    placeholder="••••••••">
            </div>

            <!-- Remember me -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-slate-300 cursor-pointer">
                    <input
                        type="checkbox"
                        class="rounded border-slate-500 bg-slate-700 text-blue-500 focus:ring-blue-500">
                    Se souvenir de moi
                </label>
            </div>

            <!-- Bouton connexion -->
            <button
                type="submit"
                class="w-full py-3 px-4 bg-primary hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-0.5 transition duration-200">
                Se connecter
            </button>
        </form>

        <!-- Séparateur -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-500/30"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-slate-900/70 px-3 text-slate-400 rounded-full">
                    ou
                </span>
            </div>
        </div>

        <!-- Lien inscription -->
        <p class="text-center text-sm text-slate-300">
            Vous n'avez pas encore de compte ?
            <a href="{% url 'sign_up' %}" class="text-blue-300 hover:text-blue-200 font-medium underline underline-offset-2">
                Créer un compte
            </a>
        </p>
    </div>

</body>
</html>
