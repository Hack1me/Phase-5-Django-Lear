{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe modifié</title>
    {% tailwind_css %}
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 p-4">

<div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">

    <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-green-500/20 flex items-center justify-center text-3xl">
        ✓
    </div>

    <h1 class="text-2xl font-bold text-white mb-4">
        Mot de passe modifié
    </h1>

    <p class="text-slate-400 mb-8">
        Votre mot de passe a été réinitialisé avec succès.
    </p>

    <a href="{% url 'sign_in' %}"
       class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-white font-medium transition">
        Se connecter
    </a>

</div>

</body>
</html>
