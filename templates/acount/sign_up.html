{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-linear-to-br from-slate-900 via-slate-800 to-blue-900 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-8">

        <!-- Logo / Titre -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">Créer un compte</h1>
            <p class="text-slate-300 mt-2">
                Rejoignez votre plateforme dès maintenant
            </p>
        </div>

        <!-- Messages Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-400 text-red-100 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulaire -->
        <form method="POST" class="space-y-5" action="{% url 'sign_up' %}">
            {% csrf_token %}

            <!-- Nom d'utilisateur -->
            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-200 mb-2">
                    Nom d'utilisateur
                </label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-400/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="Votre nom d'utilisateur">
            </div>

            <!-- Email -->
            <div>
                <label for="id_email" class="block text-sm font-medium text-slate-200 mb-2">
                    Adresse email
                </label>
                <input
                    type="text"
                    name="email"
                    id="id_email"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-400/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="exemple@email.com">
            </div>

            <!-- Mot de passe -->
            <div>
                <label for="id_password1" class="block text-sm font-medium text-slate-200 mb-2">
                    Mot de passe
                </label>
                <input
                    type="password"
                    name="password1"
                    id="id_password1"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-400/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="••••••••">
            </div>

            <!-- Confirmation -->
            <div>
                <label for="id_password2" class="block text-sm font-medium text-slate-200 mb-2">
                    Confirmer le mot de passe
                </label>
                <input
                    type="password"
                    name="password2"
                    id="id_password2"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-400/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="••••••••">
            </div>

            <!-- Bouton -->
            <button
                type="submit"
                class="w-full py-3 px-4 bg-primary hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-0.5 transition duration-200">
                S'inscrire
            </button>
        </form>

        <!-- Lien connexion -->
        <p class="text-center text-sm text-slate-300 mt-6">
            Vous avez déjà un compte ?
            <a href="#"class="text-blue-300 hover:text-blue-200 font-medium underline underline-offset-2">
                Se connecter
            </a>
        </p>
    </div>

</body>
</html>
